<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enquête — Huis clos</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="jeu">
      <section id="scene" aria-label="Scène">
        <pre id="visuel"></pre>
        <figure id="portrait-personnage" class="cache">
          <img id="portrait-personnage-image" alt="" />
        </figure>
        <figure id="illustration-zone" class="cache">
          <img id="illustration-zone-image" alt="" />
        </figure>
      </section>

      <section id="panneau-dialogue" aria-label="Dialogue">
        <div id="dialogue" role="log" aria-live="polite" aria-label="Journal de l'interrogatoire"></div>
        <form id="saisie" autocomplete="off">
          <span class="invite">&gt;</span>
          <input
            id="message"
            type="text"
            maxlength="500"
            placeholder="Décrivez ce que vous observez, faites ou demandez…"
          />
          <button
            id="btn-micro"
            type="button"
            class="btn-icone"
            title="Parler (micro)"
            aria-label="Parler au micro"
          >🎙</button>
          <button
            id="btn-voix"
            type="button"
            class="btn-icone"
            title="Voix du personnage"
            aria-label="Activer la voix du personnage"
            aria-pressed="false"
          >🔊</button>
        </form>
        <ul id="pistes" aria-label="Pistes d'interrogatoire" hidden></ul>
      </section>

      <aside id="cote">
        <section id="panneau-plan">
          <h2>PLAN DE LA PIÈCE</h2>
          <div id="plan"></div>
        </section>
        <section id="panneau-sac">
          <h2>SAC</h2>
          <ul id="sac"></ul>
          <button id="btn-accuser" type="button">⚖ ACCUSER</button>
        </section>
      </aside>
    </div>

    <div id="modale" class="cache" role="dialog" aria-modal="true">
      <div id="modale-contenu"></div>
    </div>

    <script type="module" src="/game.js"></script>
  </body>
</html>
